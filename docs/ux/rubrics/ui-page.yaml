    check: restate
    procedure: python3 $DWU/scripts/dom_checks.py restate <snapshot> --ux docs/ux --json on snapshot state(s) default; pass when the statement holds for every element, otherwise fail with one finding per violating selector
    evidence: selector
    blocking: false
