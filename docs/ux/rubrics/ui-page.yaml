    produced_by: style_check
    check: verify
    procedure: python3 $DWU/scripts/style_check.py verify docs/ux/DESIGN.md --project docs/ux/project.yaml re-exports the token file and diffs it with the file at tokens.path; when tokens.format is existing the same command runs the map-check and passes when every contract token maps to an app variable with an equal value
