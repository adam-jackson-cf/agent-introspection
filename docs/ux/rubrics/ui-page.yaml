    rule: G03
    statement: '`labels_check.py` reports zero bare codes (`\b[A-Z]{1,2}\d{1,2}\b`), snake_case tokens, UUIDs or hashes ≥ 12 hex chars in rendered text outside `data-kind="id"`.'
