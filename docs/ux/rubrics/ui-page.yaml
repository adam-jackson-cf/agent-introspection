  - id: G21a
    layer: core
    rule: G21
    statement: "`colour_usage.py <ui_source> --allow <tokens> --strict` reports zero colour literals and `dom_checks.py literals <ui_source> --allow <tokens>` zero font-family or spacing literals in page CSS/JS."
    method: detector
    produced_by: tools
    check: literals
    procedure: "python3 $DWU/scripts/colour_usage.py <ui_source> --allow <tokens> --strict and python3 $DWU/scripts/dom_checks.py literals <ui_source> --allow <tokens>; in .js, .ts, .html and framework files a named colour counts only inside a CSS value context (a <style> block, a style attribute value, a .style.<prop> assignment, a { <colorProp>: '<value>' } object entry, or an svg fill= or stroke= attribute), prose in a template literal outside those contexts is ignored, and hex and colour-function literals count everywhere outside the token file; pass only when both report zero literals; record the result with score_rubric.py record <results.json> --rubric docs/ux/rubrics/ui-page.yaml --page <page> G21a pass|fail <file:line>"
    evidence: file-line
    blocking: false
