    blocking: false
  - id: G21c
    layer: core
    rule: G21
    statement: The token file at `tokens.path` equals the re-exported `docs/ux/DESIGN.md` (`style_check.py verify`); when `tokens.format` is `existing`, every contract token maps to a variable of the app's token file with an equal value (`style_check.py map-check`).
