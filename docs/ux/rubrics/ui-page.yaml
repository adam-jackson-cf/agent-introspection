    procedure: "python3 $DWU/scripts/signals_check.py docs/ux --page <page> --snapshot <default snapshot> --check coverage [--captures <dir>]; fail with one finding per signal of this page with data.status available, derivable or proposed that no rendered element carries as q: an L1 signal is looked for in default, an L2 signal in default and in every declared state capture of the same phase (the sibling captures of the snapshot, or --captures); the evidence names the capture that rendered each L2 id"
    evidence: file-line
    blocking: false
  - id: G02a
    layer: core
    rule: G02
    statement: No text node matching `\b\d+ of \d+\b` sits in the same panel as a mark group whose count equals its second number.
