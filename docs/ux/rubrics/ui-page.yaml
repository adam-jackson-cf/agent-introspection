items:
  - id: G01a
    layer: core
    rule: G01
    statement: Every element whose snapshot `candidate` is `panel`, `figure`, `column`, `control`, `action` or `mark` carries a `q` (DOM `data-q`, or the overlay in the before phase) that is a signal id in `signals.yaml` for this page. An untagged page fails.
    method: detector
    produced_by: signals_check
    check: default
    procedure: python3 $DWU/scripts/signals_check.py docs/ux --page <page> --snapshot <default snapshot> --check default; in the before phase add --overlay docs/ux/audit-tags.json. Fail with one finding per element whose snapshot candidate is panel, figure, column, control, action or mark and whose q (own or inherited) is absent or not a signal id of this page in signals.yaml or in its top-level app_wide list; an element inside a data-role="key" container, or an action whose data-role is explain, inherits the nearest tagged ancestor's q; an untagged page therefore fails
    evidence: selector
    blocking: true
  - id: G01c
    layer: core
    rule: G01
    statement: "Zero rendered elements map to a signal marked `orphan: true`."
    method: detector
    produced_by: signals_check
    check: orphans
    procedure: "python3 $DWU/scripts/signals_check.py docs/ux --page <page> --snapshot <default snapshot> --check orphans; fail with one finding per rendered element whose q is a signal marked orphan: true"
    evidence: selector
    blocking: false
  - id: G01b
    layer: core
    rule: G01
    statement: "Every signal with `data.status` `available`, `derivable` or `proposed` renders at least one element with its id: an L1 signal in snap `default`, an L2 signal in `default` or in any declared state capture (`open`, `filter-<id>`, `land-<id>`) of the same phase."
