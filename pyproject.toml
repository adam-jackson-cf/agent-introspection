[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-introspection"
version = "0.1.0"
description = "ClickHouse-materialized agent telemetry facts and approval-gated intervention proposals"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-introspection = "agent_introspection.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "pre-commit>=4.5.0",
  "pytest>=9.0.0",
  "ruff>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_introspection"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "W",
    "C4",
    "PT",
    "PGH",
    "A",
    "D",
    "N",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_introspection"]
