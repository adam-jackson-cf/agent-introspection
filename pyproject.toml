[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-introspection"
version = "0.1.0"
description = "ClickHouse-materialized agent telemetry facts and approval-gated intervention proposals"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-introspection = "agent_introspection.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "packaging>=26.3",
  "pre-commit>=4.5.0",
  "pytest>=9.0.0",
  "pytest-cov>=6.0.0",
  "pyyaml>=6.0.3",
  "ruff>=0.15.0",
  "shellcheck-py==0.11.0.1",
  "shfmt-py==4.2.0",
  "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_introspection"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
  "boundary: T2 test that drives a local process, build, socket or loopback seam",
  "deferred: test that runs only in the install mode, under an approved exception in proofs.toml",
]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
pythonpath = ["src", "scripts", "."]
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"
fix = false
output-format = "full"
respect-gitignore = true
preview = true
exclude = [
    ".build",
    ".git",
    ".tox",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "C901",
    "UP",
    "SIM",
    "PT",
    "PGH",
    "A",
    "N",
    "RUF",
    "S110",
    "BLE001",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0917",
]
[tool.ruff.lint.isort]
known-first-party = ["agent_introspection", "lib", "tests"]
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-locals = 15
max-positional-args = 5
max-public-methods = 20
max-returns = 6
max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
follow_imports = "normal"
mypy_path = ["src", "scripts"]
explicit_package_bases = true
files = ["src", "scripts", "tests"]
show_error_codes = true
exclude = ["^tests/fixtures/"]
