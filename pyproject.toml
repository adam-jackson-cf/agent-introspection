[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-introspection"
version = "0.1.0"
description = "ClickHouse-materialized agent telemetry facts and approval-gated intervention proposals"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-introspection = "agent_introspection.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "pre-commit>=4.5.0",
  "pytest>=9.0.0",
  "pytest-cov>=6.0.0",
  "pyyaml>=6.0.3",
  "ruff>=0.15.0",
  "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_introspection"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true
output-format = "full"
respect-gitignore = true
preview = true
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "node_modules",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "tests/fixtures/",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "C901",
    "UP",
    "SIM",
    "PT",
    "PGH",
    "A",
    "D",
    "N",
    "RUF",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0917",
]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.isort]
known-first-party = []
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-locals = 15
max-positional-args = 5
max-public-methods = 20
max-returns = 6
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
follow_imports = "skip"
mypy_path = "src"
files = ["src", "scripts", "tests"]
show_error_codes = true
exclude = ["^tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["pytest", "_pytest.*"]
follow_imports = "normal"
