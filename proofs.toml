[[not_applicable]]
rule = "GOLANGCI.*"
reason = "The repository maintains no Go code: git ls-files lists no .go file, no go.mod and no golangci-lint config."
approved_by = "adam-jackson-cf, 2026-11-27"
evidence = { absent = ["*.go", "**/*.go", "go.mod", "**/go.mod", "go.sum", ".golangci*"] }

[[not_applicable]]
rule = "PARITY.dependency-inventory"
reason = "No optional analyzer dependencies: pyproject.toml declares dependencies = [] and no optional-dependencies; the only group is dev, installed by uv sync --locked --dev in the entrypoint."
approved_by = "adam-jackson-cf, 2026-11-27"
evidence = { path = "pyproject.toml", contains = "dependencies = []" }

[[not_applicable]]
rule = "TEST.property-seed"
reason = "No property-based tests: no hypothesis or fast-check import or dependency in owned code."
approved_by = "adam-jackson-cf, 2026-11-27"
evidence = { command = ["sh", "-c", "git grep -q -E '^(from|import) hypothesis|fast-check' -- . ':!tests/fixtures' ':!proofs.toml' || echo no-property-tests"], expect = "no-property-tests" }

[[not_applicable]]
rule = "TEST.mutation-sensitivity"
reason = "No mutation tool or mutation later job: no mutmut, cosmic-ray or stryker in any manifest or lock."
approved_by = "adam-jackson-cf, 2026-11-27"
evidence = { command = ["sh", "-c", "git grep -q -E 'mutmut|cosmic-ray|stryker' -- pyproject.toml uv.lock dashboard/package.json scripts/ux-probe/package.json || echo no-mutation-tool"], expect = "no-mutation-tool" }

[[not_applicable]]
rule = "PYQ201"
reason = "Ruff PLR0904 enforces the public-method limit (max-public-methods = 20 in pyproject.toml) under the ruff claim, so the bespoke copy would duplicate it."
approved_by = "adam-jackson-cf, 2026-11-27"
evidence = { path = "pyproject.toml", contains = "max-public-methods = 20" }

[[not_applicable]]
rule = "PYQ211"
reason = "No project analyzer exists: no *Analyzer class in src, scripts or .agents and [python_quality] analyzer_bases is empty, so no class has a project entrypoint to implement."
approved_by = "adam-jackson-cf, 2026-11-27"
evidence = { command = ["sh", "-c", "git grep -q -E 'class [A-Za-z]*Analyzer' -- src scripts .agents || echo no-project-analyzers"], expect = "no-project-analyzers" }

[[exception]]
rule = "PREFIX.candidates"
path = "scripts/check-*"
reason = "One command script per checker, named check-<check>; the gate entrypoint calls each as check_<name>, so the shared prefix is the naming convention, not a hidden concept."
approved_by = "adam-jackson-cf, 2026-11-27"

[[exception]]
rule = "PREFIX.candidates"
path = "scripts/lib/bun_*"
reason = "Library modules for the scripts, each named for the Bun artefact it reads (the bun test report adapter, bun.lock); a bun folder would hold two unrelated readers."
approved_by = "adam-jackson-cf, 2026-11-27"

