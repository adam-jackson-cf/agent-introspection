schema = 1

[scope]
mode = "whole"

[validator]
status = "proofs"
file = ".github/workflows/ci-quality-gates.yml"
ref = "scripts/run-ci-quality-gates.sh proofs"

[hooks]
check = ["bash", "scripts/run-ci-quality-gates.sh", "check", "hook_installed"]
expect = "pre-commit hook installed"

[[claim]]
id = "proofs.gate"
rules = ["GATE.*"]
control = [
  "scripts/validate-rule-coverage.py",
  "scripts/check-quality-gate-parity.py",
  "scripts/check-hook-installed.py",
  "scripts/run-ci-quality-gates.sh",
  ".pre-commit-config.yaml",
  ".github/workflows/ci-quality-gates.yml",
  ".github/CODEOWNERS",
]

[[claim.enforced_by]]
point = "hook"
file = ".pre-commit-config.yaml"
ref = "scripts/run-ci-quality-gates.sh hook"

[[claim.enforced_by]]
point = "ci"
file = ".github/workflows/ci-quality-gates.yml"
ref = "scripts/run-ci-quality-gates.sh static"
status = "gate"

[[claim.enforced_by]]
point = "ci"
file = ".github/workflows/ci-quality-gates.yml"
ref = "scripts/run-ci-quality-gates.sh proofs"
status = "proofs"

[[claim.canary]]
command = ["bash", "scripts/run-ci-quality-gates.sh", "check", "proofs", "{fixture}"]
passing = "tests/fixtures/proofs/proofs.gate/bound"
violating = "tests/fixtures/proofs/proofs.gate/unbound"
expect = "lacks ref"
rule = "GATE.enforced"

[[claim.canary]]
command = ["bash", "scripts/run-ci-quality-gates.sh", "check", "gate_parity", "{fixture}"]
passing = "tests/fixtures/proofs/proofs.gate/parity-matched"
violating = "tests/fixtures/proofs/proofs.gate/parity-divergent"
expect = "GATE.parity"
rule = "GATE.parity"

[[claim.canary]]
command = ["bash", "scripts/run-ci-quality-gates.sh", "check", "gate_parity", "{fixture}"]
passing = "tests/fixtures/proofs/proofs.gate/parity-matched"
violating = "tests/fixtures/proofs/proofs.gate/unowned"
expect = "GATE.self-check"
rule = "GATE.self-check"

[[claim]]
id = "host.required-checks"
rules = ["GIT.required-checks"]

[claim.host]
command = ["gh", "api", "repos/adam-jackson-cf/agent-introspection/branches/main/protection"]
expect = ["\"gate\"", "\"proofs\""]

[[claim]]
id = "security.dependency-audit"
rules = ["SECURITY.dependency-audit"]
control = ["scripts/check-dependency-audit.py", ".github/dependency-audit.json"]

[[claim.enforced_by]]
point = "hook"
file = ".pre-commit-config.yaml"
ref = "scripts/run-ci-quality-gates.sh hook"

[[claim.enforced_by]]
point = "ci"
file = ".github/workflows/ci-quality-gates.yml"
ref = "scripts/run-ci-quality-gates.sh static"
status = "gate"

[[claim.canary]]
command = ["bash", "scripts/run-ci-quality-gates.sh", "check", "dependency_audit", "{fixture}"]
passing = "tests/fixtures/proofs/security.dependency-audit/passing"
violating = "tests/fixtures/proofs/security.dependency-audit/advisory"
expect = "SECURITY.dependency-audit lock="
rule = "SECURITY.dependency-audit"
timeout_seconds = 120

[[claim.canary]]
command = ["bash", "scripts/run-ci-quality-gates.sh", "check", "dependency_audit", "{fixture}"]
passing = "tests/fixtures/proofs/security.dependency-audit/passing"
violating = "tests/fixtures/proofs/security.dependency-audit/manifest-without-lock"
expect = "SECURITY.dependency-audit failure=manifest-without-lock"
rule = "SECURITY.dependency-audit"
timeout_seconds = 120

[[claim]]
id = "parity.locks"
rules = ["PARITY.lock-version", "PARITY.package-manager"]
control = ["scripts/check-lock-parity.py"]

[[claim.enforced_by]]
point = "hook"
file = ".pre-commit-config.yaml"
ref = "scripts/run-ci-quality-gates.sh hook"

[[claim.enforced_by]]
point = "ci"
file = ".github/workflows/ci-quality-gates.yml"
ref = "scripts/run-ci-quality-gates.sh static"
status = "gate"

[[claim.canary]]
command = ["bash", "scripts/run-ci-quality-gates.sh", "check", "lock_parity", "{fixture}"]
passing = "tests/fixtures/proofs/parity.locks/passing"
violating = "tests/fixtures/proofs/parity.locks/lock-version"
expect = "PARITY.lock-version"
rule = "PARITY.lock-version"

[[claim.canary]]
command = ["bash", "scripts/run-ci-quality-gates.sh", "check", "lock_parity", "{fixture}"]
passing = "tests/fixtures/proofs/parity.locks/passing"
violating = "tests/fixtures/proofs/parity.locks/package-manager"
expect = "PARITY.package-manager"
rule = "PARITY.package-manager"

[[claim]]
id = "parity.install-guidance"
rules = ["PARITY.install-guidance"]
control = ["scripts/check-install-guidance.py", "scripts/fresh-install/sandbox.sh"]

[[claim.enforced_by]]
point = "hook"
file = ".pre-commit-config.yaml"
ref = "scripts/run-ci-quality-gates.sh hook"

[[claim.enforced_by]]
point = "ci"
file = ".github/workflows/ci-quality-gates.yml"
ref = "scripts/run-ci-quality-gates.sh static"
status = "gate"

[[claim.enforced_by]]
point = "ci"
file = ".github/workflows/ci-quality-gates.yml"
ref = "scripts/run-ci-quality-gates.sh install"
status = "gate"

[[claim.canary]]
command = ["bash", "scripts/run-ci-quality-gates.sh", "check", "install_guidance", "{fixture}"]
passing = "tests/fixtures/proofs/parity.install-guidance/passing"
violating = "tests/fixtures/proofs/parity.install-guidance/violating"
expect = "PARITY.install-guidance"
rule = "PARITY.install-guidance"

[[claim]]
id = "skill.metadata"
rules = ["SKILL.metadata"]
control = ["scripts/check-skill-metadata.py", ".agents/skill-metadata.schema.json"]

[[claim.enforced_by]]
point = "hook"
file = ".pre-commit-config.yaml"
ref = "scripts/run-ci-quality-gates.sh hook"

[[claim.enforced_by]]
point = "ci"
file = ".github/workflows/ci-quality-gates.yml"
ref = "scripts/run-ci-quality-gates.sh static"
status = "gate"

[[claim.canary]]
command = ["bash", "scripts/run-ci-quality-gates.sh", "check", "skill_metadata", "{fixture}"]
passing = "tests/fixtures/proofs/skill.metadata/passing/introspection-good/SKILL.md"
violating = "tests/fixtures/proofs/skill.metadata/violating/wrong-directory/SKILL.md"
expect = "SKILL.metadata"
rule = "SKILL.metadata"

[python_quality]
maintained_roots = ["scripts", "src", "tests"]
skill_roots = [".agents/skills"]
script_root = "scripts"
script_module_directory = "scripts/lib"
script_names = [
    "check-coverage-slice.py",
    "check-dependency-audit.py",
    "check-lock-parity.py",
    "check-python-fanout.py",
    "check-python-mypy.py",
    "check-python-quality.py",
    "check-python-scalability.py",
    "check-python-suppressions.py",
    "check-runner-failure-propagation.py",
    "check-skill-metadata.py",
    "check-test-subprocess-timeouts.py",
    "guardrails-tool-canary.py",
    "list-python-scope.py",
    "render-measures.py",
    "validate-rule-coverage.py",
]
test_root = "tests"
test_root_files = ["tests/__init__.py", "tests/conftest.py"]
test_groups = ["fixtures", "integration", "seams", "support", "unit"]
non_package_directories = [".github", "fixtures", "scripts", "src", "tests"]
generic_name_parts = [
    "common",
    "compat",
    "fallback",
    "helpers",
    "legacy",
    "manager",
    "misc",
    "new",
    "old",
    "stuff",
    "temp",
    "utils",
]
generic_name_allowlist = []
class_max_lines = 700
class_max_init_args = 8
class_max_instance_attributes = 12
analyzer_bases = []
dynamic_import_adapters = []
contract_roots = ["src/agent_introspection"]
max_loop_depth = 2
analyzer_prefixes = ["scripts", "src", "tests"]
ownership_markers = ["CODEOWNERS", ".github/CODEOWNERS", "docs/CODEOWNERS"]
fanout_root_packages = ["agent_introspection"]
fanout_max = 10
large_module_nloc = 800
large_module_fanout_max = 3

[python_quality.excluded_paths]
"tests/fixtures" = "canary fixtures: deliberately violating inputs that checkers judge only when passed explicitly"

[python_quality.flat_test_groups]
unit = "test_*.py"

[python_quality.project_analyzer_entrypoints]

[python_quality.subprocess_wrappers]
"scripts/check-dependency-audit.py" = ["_run"]
"scripts/check-python-mypy.py" = ["_mypy"]
"scripts/check-runner-failure-propagation.py" = ["_run"]
"scripts/check-skill-metadata.py" = ["_git_ls_files"]
"scripts/check-test-subprocess-timeouts.py" = ["_git_ls_files"]
"scripts/guardrails-tool-canary.py" = ["_run"]
"scripts/lib/python_quality_scope.py" = ["_git_output"]
"scripts/validate-rule-coverage.py" = ["_run"]
"src/agent_introspection/classify.py" = ["_run_key_command"]
"src/agent_introspection/dashboard_service.py" = ["_run_bun"]
"src/agent_introspection/doctor_harness.py" = ["_run_version"]
"src/agent_introspection/drafting.py" = ["run_codex"]
"src/agent_introspection/facts.py" = ["run", "_run_local_command"]
"src/agent_introspection/hook_install.py" = ["_run_omp"]
"src/agent_introspection/schedule.py" = ["launchctl", "systemctl"]
"src/agent_introspection/signoz_detect.py" = ["_run_docker"]
"tests/test_command_shape_parity.py" = ["_clickhouse_query"]
"tests/test_hook_install.py" = ["_run_shim"]
"tests/test_hooks.py" = ["_pause", "_run_activity_shim", "_run_bun_probe"]
"tests/test_preflight.py" = ["_run_python"]
"tests/test_python_checker_scripts.py" = ["_run"]
"tests/test_quality_scripts.py" = ["_git", "_run", "_validate"]
"tests/test_signoz_detect.py" = ["_run_install"]

[python_quality.filesystem_seams]
"tests/test_python_checker_scripts.py" = ["_repository_table", "_write_module"]

[python_quality.environment_seams]
"src/agent_introspection/cli.py" = ["_configured_path"]
"src/agent_introspection/dashboard_api.py" = ["_url_override"]
"src/agent_introspection/facts.py" = ["_environment_value"]
"tests/test_command_shape_parity.py" = ["_live_clickhouse_requested"]

