schema = 1

[structure]
base_ref = "origin/main"
source_root = "src"
import_package = "agent_introspection"
tiers = ["contract", "store", "domain", "service", "interface"]
banned_words = [
  "common",
  "compat",
  "fallback",
  "helpers",
  "legacy",
  "manager",
  "misc",
  "new",
  "old",
  "stuff",
  "temp",
  "utils",
]
catalogue_plurals = [
  "agents",
  "assets",
  "commands",
  "docs",
  "experiments",
  "extensions",
  "fixtures",
  "problems",
  "references",
  "rules",
  "scripts",
  "skills",
  "stages",
  "templates",
  "tests",
  "tools",
  "workflows",
]
fixed_files = [
  "__init__.py",
  "__main__.py",
  "conftest.py",
  "index.ts",
  "index.tsx",
  "index.js",
  "index.jsx",
  "index.mts",
  "index.cts",
  "index.mjs",
  "index.cjs",
  "*.d.ts",
  "*.d.mts",
  "*.d.cts",
  "Dockerfile",
  "Dockerfile.*",
  "Containerfile",
  "Makefile",
  "GNUmakefile",
  "makefile",
  "package.json",
  "package-lock.json",
  "npm-shrinkwrap.json",
  "tsconfig.json",
  "tsconfig.*.json",
  "jsconfig.json",
  "pyproject.toml",
  "go.mod",
  "go.sum",
  "AGENTS.md",
  "CLAUDE.md",
  "README",
  "README.md",
  "LICENSE",
  "LICENSE.*",
  "COPYING",
  "devcontainer.json",
  ".devcontainer.json",
  ".gitignore",
  ".gitattributes",
  ".editorconfig",
  ".npmrc",
  ".nvmrc",
  ".python-version",
  ".tool-versions",
  "uv.lock",
  "bun.lock",
  "pnpm-lock.yaml",
  "yarn.lock",
  "go.work",
  "go.work.sum",
  "requirements.txt",
  "ruff.toml",
  ".ruff.toml",
  "mypy.ini",
  ".mypy.ini",
  ".importlinter",
  ".golangci.yml",
  ".golangci.yaml",
  ".golangci.toml",
  ".golangci.json",
  ".shellcheckrc",
  "shellcheckrc",
  "biome.json",
  "biome.jsonc",
  "eslint.config.*",
  ".oxlintrc.json",
  "oxlint.config.ts",
  "vitest.config.*",
  ".node-version",
]
repeat_exempt_files = ["__init__.py", "__main__.py"]
pyq_owned_extensions = [".py"]
test_name_patterns = ["test_*.py", "*_test.py"]

[structure.tier_modules]
contract = [
  "__init__",
  "command_shape",
  "config",
  "config_writers",
  "interventions",
  "json_types",
  "report_summary",
  "workflow",
]
store = [
  "capabilities",
  "facts",
  "facts_sql",
  "harness_profiles",
  "hooks",
  "spool",
]
domain = [
  "candidates",
  "evaluation",
  "evidence",
  "findings",
  "inbox",
  "preflight",
  "profiles",
  "proposals",
  "review",
  "schedule",
]
service = [
  "classify",
  "cli_common",
  "dashboard_api",
  "dashboard_service",
  "doctor",
  "doctor_harness",
  "drafting",
  "harness_config",
  "hook_install",
  "producers",
  "setup_flow",
  "signoz_detect",
]
interface = [
  "cli",
  "cli_dashboard",
  "cli_doctor",
  "cli_facts",
  "cli_harness",
  "cli_onboarding",
  "cli_producers",
  "cli_proposals",
  "cli_setup",
  "cli_signoz",
]

[structure.owners]
".agents/skills/" = "skills"
".claude/" = "skills"
".codegraph/" = "tooling"
".github/" = "ci"
".markdownlint-cli2.jsonc" = "tooling"
".pre-commit-config.yaml" = "ci"
"config.example.toml" = "package"
"dashboard/" = "dashboard"
"docs/" = "docs"
"mise.toml" = "tooling"
"proofs.toml" = "ci"
"scripts/" = "tooling"
"src/agent_introspection/" = "package"
"tests/" = "tests"

[structure.casing]
"scripts/*" = "kebab-case"
".github/workflows/*" = "kebab-case"

[structure.casing_patterns]
"kebab-case" = "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"

[structure.skill_layout]
root = ".agents/skills"
marker = "SKILL.md"
files = ["SKILL.md", "README.md", "references/*.md", "assets/**", "scripts/**"]

[layout]
fixtures_dir = "tests/fixtures"
