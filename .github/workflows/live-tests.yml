name: Live tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t3:
    runs-on: [self-hosted, signoz]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: dashboard/package.json
      - run: scripts/ci t3
