name: CI quality gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: dashboard/package.json
      - run: bash scripts/run-ci-quality-gates.sh static
  t1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: dashboard/package.json
      - run: bash scripts/run-ci-quality-gates.sh t1
  t2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: dashboard/package.json
      - run: bash scripts/run-ci-quality-gates.sh t2
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: dashboard/package.json
      - run: bash scripts/run-ci-quality-gates.sh proofs
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: dashboard/package.json
      - run: bash scripts/run-ci-quality-gates.sh install
  gate:
    needs: [static, t1, t2, fresh-install]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.static.result }}" = success
          test "${{ needs.t1.result }}" = success
          test "${{ needs.t2.result }}" = success
          test "${{ needs.fresh-install.result }}" = success
