[database]
path = "~/.local/share/agent-introspection/introspection.sqlite3"
busy_timeout_ms = 5000

# The SigNoz on this machine. Every key has a default, which suits a SigNoz installed
# by the onboarding skill's install-signoz.sh; non-local addresses are refused.
# clickhouse_url is ClickHouse's HTTP interface, which the CLI and the dashboard both
# read. SigNoz does not publish it by default: publish it on loopback with the skill's
# scripts/signoz/docker-compose.clickhouse-http.yaml, or name a local container address
# your runtime resolves (such as OrbStack's *.orb.local). A password, if any, is
# printed by a command (usable by the scheduled sync) and never stored in this file.
# INTROSPECTION_CLICKHOUSE_URL overrides clickhouse_url for the dashboard only.
# [signoz]
# clickhouse_url = "http://127.0.0.1:8123"
# clickhouse_user = "default"
# clickhouse_password_command = ["security", "find-generic-password", "-s", "signoz-clickhouse", "-w"]
# otlp_endpoint = "http://127.0.0.1:4318"   # OTLP/HTTP collector harnesses export to (never 4317)

# The harnesses this machine uses. Harness parity, the dashboard's harness selector,
# and the findings detectors cover only these; a signal some enabled harness cannot
# produce is hidden here. Keys are the registry harnesses (oh-my-pi, codex-app-server,
# codex_cli_rs, codex_exec, claude-code); `codex` names the three Codex surfaces.
# Absent means every registry harness. `facts install` loads the list into ClickHouse.
# [harnesses]
# enabled = ["claude-code", "oh-my-pi", "codex"]

# Where activity-hook and spool-status records are sent: an OTLP/HTTP logs URL (never
# the gRPC port 4317). Absent means /v1/logs on the collector this machine's harnesses
# export to ([signoz] otlp_endpoint, or [machine] export_endpoint on an additional
# machine), which is right unless records must go elsewhere.
# [hooks]
# otlp_logs_endpoint = "http://127.0.0.1:4318/v1/logs"

# Prompt labels need an OpenRouter key. OPENROUTER_API_KEY works for interactive runs,
# but the scheduled sync does not see it: give it a command that prints the key (an
# argv list such as a Keychain lookup), so the key is never stored in this file. With
# neither, labels use omp's stored credential (`omp token openrouter`) when omp is
# installed.
# [labels]
# openrouter_key_command = ["security", "find-generic-password", "-s", "openrouter", "-w"]

# This machine's role. Absent, or role = "host", means it runs SigNoz and the facts
# store. An additional machine runs harnesses but no SigNoz and sends everything to the
# host's collector: set role = "additional" and export_endpoint to that collector's
# OTLP/HTTP base URL (another machine's address is allowed here; no credentials).
# `harness configure` then writes that endpoint into each harness, records go to its
# /v1/logs, `doctor` checks the host's collector and the spool-sync timer instead of
# SigNoz, and commands that need ClickHouse (facts, producers) refuse to run. [signoz]
# and [labels] are not used there.
# [machine]
# role = "additional"
# export_endpoint = "http://signoz-host.local:4318"
