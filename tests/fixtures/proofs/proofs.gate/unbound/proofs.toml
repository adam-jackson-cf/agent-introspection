schema = 1

[scope]
mode = "whole"

[validator]
status = "proofs"
file = "ci.yml"
ref = "validate --root ."

[[claim]]
id = "check"
rules = ["A.rule"]
control = ["check.sh"]

[[claim.enforced_by]]
point = "ci"
file = "ci.yml"
ref = "sh absent.sh"
status = "gate"

[[claim.canary]]
command = ["sh", "check.sh", "{fixture}"]
passing = "good.txt"
violating = "bad.txt"
expect = "A.rule: violation"
