schema = 1

[scope]
mode = "whole"

[[claim]]
id = "gate"
rules = ["GATE.*"]
control = ["scripts/gate.sh"]

[[claim.enforced_by]]
point = "hook"
file = ".pre-commit-config.yaml"
ref = "scripts/gate.sh hook"

[[claim.enforced_by]]
point = "ci"
file = ".github/workflows/ci.yml"
ref = "scripts/gate.sh static"
status = "gate"

[[claim.enforced_by]]
point = "ci"
file = ".github/workflows/ci.yml"
ref = "scripts/gate.sh proofs"
status = "proofs"
