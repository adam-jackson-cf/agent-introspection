on:
  push:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci static
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci proofs
  gate:
    needs: [static]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.static.result }}" = success
